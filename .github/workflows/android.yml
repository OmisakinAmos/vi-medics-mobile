name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Public values only (publishable key is designed to ship inside client apps).
      VITE_SUPABASE_URL: https://vzisnnouahikrauajvtv.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_O7Iyge-eRcbTCjygWsHxNg_WeKHMziD
      VITE_API_BASE_URL: https://vi-medics.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Generate icons and splash screens
        continue-on-error: true
        run: npm run cap:assets

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk vi-medics.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vi-medics-apk
          path: vi-medics.apk

      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vi-Medics Android build ${{ github.run_number }}
          body: Debug-signed APK. Download vi-medics.apk below, open it on an Android phone and allow install from this source.
          files: vi-medics.apk
          make_latest: true

      - name: Commit generated Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: add generated Android project [skip ci]"
            git push
          fi
