name: Deploy web app to Vercel

# Deploys the website to vi-medics.vercel.app on every push to main.
# Requires the repository secret VERCEL_TOKEN (create at vercel.com/account/tokens).
on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'assets/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_2rPXNGL7jg7tHpF7xoFMSS4j
  VERCEL_PROJECT_ID: prj_ebd6whlpEy9RZaTvv3H1a0e313Cr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check token is set
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a repository secret named VERCEL_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Pull Vercel project settings and environment variables
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
